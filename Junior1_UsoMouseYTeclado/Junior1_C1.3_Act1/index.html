/* Misma estética que los juegos de Mimi: laguna nocturna, botones amarillos, Fredoka en mayúsculas. Escena arriba, teclado en pantalla abajo. */
:root{--bg:#0b1533;--btn:#ffd54a;--btnt:#3b2a00;--btns:#c98f00;--ink:#fff;--glow:#ffe680;--shade:#1a2a6c;color-scheme:dark}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;margin:0;padding:0;background:var(--bg);font-family:'Fredoka','Trebuchet MS',Arial,sans-serif;text-transform:uppercase;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#stage{position:relative;flex:none;width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16));overflow:hidden;touch-action:none;outline:none}
canvas{position:absolute;inset:0;width:100%;height:100%}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;text-align:center;color:var(--ink)}
.scr.on{display:flex}
h1{margin:.45em 0 0;line-height:1.05;font-size:2.7em;color:var(--glow);text-shadow:0 .08em 0 var(--shade),0 0 .5em var(--btn);text-wrap:balance}
p{margin:.35em 0 0;font-size:1.25em;font-weight:500;letter-spacing:.03em}
.btn,.round{font-family:inherit;font-weight:700;border:0;cursor:pointer;text-transform:uppercase}
.btn{font-size:1.7em;border-radius:2em;padding:.45em 1.5em;margin:.4em;background:var(--btn);color:var(--btnt);box-shadow:0 .15em 0 var(--btns)}
.btn:active,.round:active{transform:translateY(.12em)}
.btn:focus-visible,.round:focus-visible{outline:.18em solid var(--ink);outline-offset:.15em}
.round{position:absolute;top:.5em;width:2.2em;height:2.2em;border-radius:50%;font-size:1.5em;background:var(--btn);color:var(--btnt);box-shadow:0 .1em 0 var(--btns)}
#back{left:.4em;display:none}#snd{right:.4em}
.sp{flex:1}
#start .btn{margin-bottom:1.3em}
@media (prefers-reduced-motion:reduce){.btn:active{transform:none}}
</style>
</head>
<body>
<div id="stage" tabindex="0">
<canvas id="c"></canvas>
<div class="scr on" id="start">
  <h1>LA LAGUNA MUSICAL</h1>
  <p>APRIETA CUALQUIER TECLA Y MIRA QUÉ PASA</p>
  <div class="sp"></div>
  <button class="btn" id="go">¡EMPEZAR!</button>
</div>
<button class="round" id="back" title="VOLVER AL INICIO" aria-label="Volver al inicio">⌂</button>
<button class="round" id="snd" title="SONIDO" aria-label="Sonido">🔊</button>
</div>
<script>
const W=960,H=600,VW=H*16/9,OX=(VW-W)/2;
const $=i=>document.getElementById(i),cv=$('c'),x=cv.getContext('2d'),st=$('stage');
const COLS=['#e2603f','#3fae5a','#d99400','#4a7be0','#c04fc0','#23a6a6'];
/* ---- escenario 16:9: el juego se dibuja en 960x600 centrado y los fondos se extienden a los costados ---- */
function extBg(c){const px=Math.round(OX*c.height/H),o=document.createElement('canvas');o.width=c.width+2*px;o.height=c.height;const g=o.getContext('2d');g.drawImage(c,px,0);g.save();g.translate(px,0);g.scale(-1,1);g.drawImage(c,0,0,px,c.height,0,0,px,c.height);g.restore();g.save();g.translate(px+c.width,0);g.scale(-1,1);g.drawImage(c,c.width-px,0,px,c.height,-px,0,px,c.height);g.restore();return o}
function bgDraw(c){if(!c._ext)c._ext=extBg(c);x.drawImage(c._ext,-OX,0,VW,H)}
function fit(){const d=Math.min(devicePixelRatio||1,2);cv.width=st.clientWidth*d;cv.height=st.clientHeight*d;st.style.fontSize=st.clientHeight/37.5+'px'}
addEventListener('resize',fit);
const bg=document.createElement('canvas');bg.width=1920;bg.height=1200;
function drawBg(){const b=bg.getContext('2d');b.scale(2,2);
let g=b.createLinearGradient(0,0,0,400);g.addColorStop(0,'#101a4d');g.addColorStop(.6,'#3a2a7a');g.addColorStop(1,'#7a56a8');b.fillStyle=g;b.fillRect(0,0,W,H);
let s=7;const r=()=>(s=(s*9301+49297)%233280)/233280;
b.fillStyle='#fff';for(let i=0;i<60;i++){b.globalAlpha=.4+r()*.6;b.beginPath();b.arc(r()*W,r()*300,1+r()*1.8,0,7);b.fill()}b.globalAlpha=1;
g=b.createRadialGradient(780,110,40,780,110,150);g.addColorStop(0,'rgba(255,246,200,.6)');g.addColorStop(1,'rgba(255,246,200,0)');b.fillStyle=g;b.fillRect(600,0,360,280);
b.fillStyle='#fff6c8';b.beginPath();b.arc(780,110,58,0,7);b.fill();
b.fillStyle='#5a4a2a';b.beginPath();b.arc(762,102,5,0,7);b.arc(798,102,5,0,7);b.fill();
b.strokeStyle='#5a4a2a';b.lineWidth=4;b.lineCap='round';b.beginPath();b.arc(780,112,18,.2,2.9);b.stroke();
b.fillStyle='rgba(255,140,160,.5)';b.beginPath();b.arc(750,120,8,0,7);b.arc(810,120,8,0,7);b.fill();
b.fillStyle='#2a2f75';[[120,420,260,70],[420,430,320,60],[760,425,280,75]].forEach(o=>{b.beginPath();b.ellipse(o[0],o[1],o[2],o[3],0,Math.PI,0);b.fill()});
g=b.createLinearGradient(0,400,0,H);g.addColorStop(0,'#2a8a8a');g.addColorStop(1,'#0f3d55');b.fillStyle=g;b.fillRect(0,400,W,200);
b.strokeStyle='rgba(255,255,255,.14)';b.lineWidth=3;for(let i=0;i<14;i++){const px=r()*W,py=420+r()*160;b.beginPath();b.moveTo(px,py);b.quadraticCurveTo(px+20,py-6,px+44,py);b.stroke()}
[[40,470,120],[85,455,95],[130,470,135],[745,450,100],[790,462,125]].forEach(c=>{b.strokeStyle='#3d7a3a';b.lineWidth=6;b.beginPath();b.moveTo(c[0],c[1]);b.lineTo(c[0]+8,c[1]-c[2]);b.stroke();b.fillStyle='#7a4a2a';b.beginPath();b.ellipse(c[0]+8,c[1]-c[2]-14,9,22,0,0,7);b.fill()});
[[200,500,50],[700,528,44],[320,578,36],[640,580,40],[880,400,30]].forEach(p=>pad(b,p[0],p[1],p[2]));
b.fillStyle='#ff8fb0';b.beginPath();b.arc(210,494,9,0,7);b.fill();b.fillStyle='#ffe680';b.beginPath();b.arc(210,494,4,0,7);b.fill()}
function pad(b,px,py,rx,big){b.fillStyle=big?'#4cc45f':'#3fae5a';b.beginPath();b.ellipse(px,py,rx,rx*.28,0,0,7);b.fill();b.strokeStyle='#2c8a45';b.lineWidth=3;b.stroke()}

for(const f of flies){if(f.puff)continue;const t=T-f.t0,p=flyPos(f),pop=t<.35?1+Math.sin(t/.35*Math.PI)*.25:1,sc=Math.min(1,t/.2)*pop,a=p.y<30?Math.max(0,(p.y+90)/120):1;bigFly(p.x,p.y,f.ch,sc*.95,a,f.ph)}
for(const p of puffs)puffD(p.x,p.y,(T-p.t)/.5)}

function drawCover(){x.fillStyle='rgba(6,12,30,.72)';x.fillRect(-OX,0,VW,H);
const items=['LETRAS','NÚMEROS','ESPACIO','ENTER','FLECHAS','BORRAR'];
items.forEach((lab,i)=>{const cx=110+i*148,top=138,w=132,h=250;x.fillStyle='#142357';x.strokeStyle='rgba(255,230,110,.45)';x.lineWidth=2.5;x.beginPath();x.roundRect(cx-w/2,top,w,h,18);x.fill();x.stroke();
 const ky=top+40,cy=top+140,t=(T+i*.7)%3,on=t<.35?1-t/.35:0;
 x.fillStyle='#ffe680';x.font='700 17px Fredoka,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(lab,cx,top+h-20);
 x.save();x.beginPath();x.roundRect(cx-w/2,top,w,h,18);x.clip();
 if(i===0){keyCap('let',cx,ky,50,38,on,'A');bigFly(cx,cy-Math.min(1,t/1.5)*20+Math.sin(T*3)*4,'A',.62,1,1)}
 else if(i===1){keyCap('num',cx,ky,50,38,on,'3');x.fillStyle='rgba(143,224,255,.25)';x.fillRect(cx-w/2,cy+36,w,40);for(let j=0;j<3;j++){const u=((t-j*.15)/1.1);if(u>0&&u<1){const px=cx-40+j*40,py=cy+44-Math.sin(u*Math.PI)*75;fishD(px,py,-Math.cos(u*Math.PI)*1.1,FC[j],.7)}}}
 else if(i===2){keyCap('space',cx,ky,110,38,on,'ESPACIO');pad(x,cx,cy+60,50,true);mimi(cx,cy+58,.38,t<.9?Math.sin(t/.9*Math.PI)*55:0,0,t<.9)}
 else if(i===3){keyCap('enter',cx,ky,80,38,on,'ENTER');duck(cx-10,cy+62,.72,t<.5&&Math.sin(t*24)>0,1);if(t<1.1)bubble('¡CUAC!',cx,cy-34,1)}
 else if(i===4){[['▲',0,-1],['◀',-1,0],['▼',0,0],['▶',1,0]].forEach(([l,dx,dy],j)=>keyCap('arrow',cx+dx*34,ky+6+dy*26,30,24,Math.floor(t/.75)===j?.8:0,l));const ph=(T%4)/4,px=cx+Math.sin(ph*6.28)*20;ant(px,cy+50,T*3,1.1,Math.cos(ph*6.28)>0)}
 else{keyCap('back',cx,ky,100,38,on,'BORRAR');if(t<1.4)bigFly(cx,cy+10,'M',.55,1,2);else puffD(cx,cy+10,Math.min(1,(t-1.4)/.5),.9)}
 x.restore()})}

function draw(){x.setTransform(1,0,0,1,0,0);x.fillStyle='#0b1533';x.fillRect(0,0,cv.width,cv.height);{const k=cv.height/H;x.setTransform(k,0,0,k,(cv.width-W*k)/2,0)}bgDraw(bg2);
drawScene();if(mode==='start')drawCover();else drawKeyboard()}
let last=0;function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}

/* ---------- navegación ---------- */
function start(){mode='play';$('start').classList.remove('on');$('back').style.display='block';try{st.focus()}catch(e){}flies=[];fish=[];say('¡Aprieta cualquier tecla y mira qué pasa en la laguna!')}
$('go').onclick=start;
$('back').onclick=()=>{mode='start';$('start').classList.add('on');$('back').style.display='none';try{speechSynthesis.cancel()}catch(e){}};
$('snd').onclick=()=>{sound=!sound;$('snd').textContent=sound?'🔊':'🔇';if(!sound)try{speechSynthesis.cancel()}catch(e){}};
try{speechSynthesis.getVoices()}catch(e){}
fit();requestAnimationFrame(loop);
</script>
