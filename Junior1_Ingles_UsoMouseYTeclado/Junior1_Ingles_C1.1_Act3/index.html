function torch(tx,ty){x.fillStyle='#7a4a2a';x.fillRect(tx-3,ty-4,6,22);const f=1+Math.sin(T*16+tx+ty)*.15;x.save();x.shadowColor='#ffd54a';x.shadowBlur=18;x.fillStyle='#ffb020';x.beginPath();x.ellipse(tx,ty-10,6,10*f,0,0,7);x.fill();x.fillStyle='#fff6a0';x.beginPath();x.ellipse(tx,ty-7,3,5*f,0,0,7);x.fill();x.restore()}

/* ---------- tablero ---------- */
function genBoard(cols,rows,k,ny){const amp=[1,2,Math.ceil(rows/2)][k],S=k+2,r0=rnd(rows),path=[[0,r0]];let c=0,r=r0;
for(let sg=0;sg<S;sg++){const e=Math.round((sg+1)*cols/S)-1;while(c<e){c++;path.push([c,r])}
 if(sg<S-1){let op=[...Array(rows).keys()].filter(v=>Math.abs(v-r)>=amp);if(!op.length)op=[...Array(rows).keys()].filter(v=>v!==r);const r2=op[rnd(op.length)];while(r!==r2){r+=Math.sign(r2-r);path.push([c,r])}}}
const ps=new Set(path.map(k2)),cand=[];
for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){if(ps.has(i+','+j))continue;let near=0;for(const p of path)if(Math.abs(p[0]-i)<=1&&Math.abs(p[1]-j)<=1)near=1;cand.push({c:i,r:j,near:near+Math.random()*.9})}
cand.sort((a,b)=>b.near-a.near);const yac=cand.slice(0,ny).map(q=>({c:q.c,r:q.r,ph:Math.random()*6,dir:Math.random()<.5?1:-1,snap:0}));
return{path,yac}}
function loadGuest(){const L=LV[lvl],cell=Math.min(BW/L.c,400/L.r),bh=cell*L.r,g=genBoard(L.c,L.r,gi,L.y);
B={cols:L.c,rows:L.r,cell,y0:CY-bh/2,bh,path:g.path,pset:new Set(g.path.map(k2)),yac:g.yac,pads:new Map(),pile:g.path.length+L.x};
phase='intro';ph=0;holding=false;flyers=[];ripples=[];msg=null;idleT=0;saidWrong=false;gs=null}
function resetGuest(){B.pads.clear();B.pile=B.path.length+LV[lvl].x;phase='build';gs=null;idleT=0;msg=null}
const cc=(c,r)=>({x:BX+(c+.5)*B.cell,y:B.y0+(r+.5)*B.cell});
const startPt=()=>({x:BX-40,y:cc(0,B.path[0][1]).y}),goalPt=()=>({x:BX+BW+44,y:cc(B.cols-1,B.path[B.path.length-1][1]).y});
function cellAt(p){const c=Math.floor((p.x-BX)/B.cell),r=Math.floor((p.y-B.y0)/B.cell);return c>=0&&c<B.cols&&r>=0&&r<B.rows?[c,r]:null}
const complete=()=>B.path.every(p=>B.pads.has(k2(p)));
const yacAt=c=>B.yac.find(y=>y.c===c[0]&&y.r===c[1]);

/* ---------- sonidos extra ---------- */
function splash(){if(!sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const n=ac.sampleRate*.55|0,bf=ac.createBuffer(1,n,ac.sampleRate),d=bf.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n)**2;
const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();f.type='lowpass';f.frequency.value=900;g.gain.value=.4;s.buffer=bf;s.connect(f);f.connect(g);g.connect(ac.destination);s.start()}catch(e){}}

/* ---------- navegación ---------- */
function go(m){mode=m;holding=false;flyers=[];msg=null;
['start','pick','end'].forEach(k=>$(k).classList.toggle('on',k===m));
$('back').style.display=m==='start'?'none':'block';st.style.cursor='default';
if(m==='end'){conf=[];$('next').style.display=lvl<2?'':'none';
 const n=[[392,.75],[392,.25],[440,1],[392,1],[523,1],[494,2],[392,.75],[392,.25],[440,1],[392,1],[587,1],[523,2]];let t=.2;n.forEach(([f,d])=>{tone(f,d*.32*.95,.12,t,'triangle');t+=d*.32});
 setTimeout(()=>{if(mode==='end')say('All the guests are here! Let Mimi\'s party begin!')},t*1000)}}
function startLevel(l){lvl=l;gi=0;arrived=[];firstGuest=true;conf=[];go('play');loadGuest()}
function arrive(){arrived.push(gi);burst(SPOTS[gi].x,SPOTS[gi].y-40,70);[523,659,784,1047].forEach((f,i)=>tone(f,.3,.14,i*.13));say('Very good! '+cap(GN[gi])+' made it to the party.')}
function fall(){const p=gs.pts[gs.pts.length-1];for(let i=0;i<3;i++)ripples.push({x:p.x,y:p.y,t:T+i*.18,big:1});splash();
msg={x:p.x,y:p.y-B.cell*.9,t:2.2};say('Oops! A lily pad was missing on the path and '+GN[gi]+' fell in the water. Let\'s try again!')}
function startCross(ok){const m=ok?B.path.length:B.path.findIndex(p=>!B.pads.has(k2(p)));
const pts=[startPt(),...B.path.slice(0,ok?m:m+1).map(p=>cc(p[0],p[1]))];if(ok)pts.push(goalPt(),SPOTS[gi]);
gs={pts,s:0,ok,end:0,lastI:0};phase=ok?'cross':'fail';holding=false;st.style.cursor='default';if(ok)tone(880,.2,.1)}

/* ---------- mouse ---------- */
function loc(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
const nearPile=p=>Math.hypot(p.x-PX,p.y-(PY-15))<72;
st.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;
if(mode==='start'){say('Press the left button on the pile of lily pads, drag it without letting go to the glowing path, and drop it in the water.');return}
if(mode!=='play'||phase!=='build'||e.button!==0)return;const p=loc(e);pos=p;
if(nearPile(p)&&B.pile>0){holding=true;B.pile--;idleT=0;try{st.setPointerCapture(e.pointerId)}catch(_){}tone(660,.12,.12);tone(990,.15,.1,.06);st.style.cursor='grabbing'}
else{hintT=1.6;tone(240,.18,.1,0,'triangle')}});
st.addEventListener('pointermove',e=>{pos=loc(e);if(mode==='play'&&!holding)st.style.cursor=phase==='build'&&nearPile(pos)&&B.pile>0?'grab':'default'});
function sendBack(p){flyers.push({x0:p.x,y0:p.y,t:0})}
function release(){if(!holding)return;holding=false;st.style.cursor='default';idleT=0;const c=cellAt(pos);
if(!c){sendBack(pos);tone(330,.15,.08,0,'triangle');return}
const y=yacAt(c);if(y){y.snap=1;sendBack(pos);tone(140,.12,.2,0,'square');tone(105,.16,.2,.12,'square');msg={x:pos.x,y:pos.y-B.cell*.7,t:1.3,txt:'CHOMP!'};say('Watch out for the alligator!');return}
if(B.pads.has(k2(c))){sendBack(pos);tone(330,.15,.08,0,'triangle');return}
const ok=B.pset.has(k2(c)),q=cc(c[0],c[1]);B.pads.set(k2(c),{rot:Math.random()*6.28,ok,at:T,fl:Math.random()<.2});ripples.push({x:q.x,y:q.y,t:T});
if(ok){tone(520,.12,.13);tone(780,.18,.12,.07)}else{tone(300,.2,.12,0,'triangle');if(!saidWrong){saidWrong=true;say('Oops! That spot does not glow. Each lily pad goes on the glowing path.')}}
if(complete())startCross(true);else if(B.pile+flyers.length<=0)startCross(false)}
st.addEventListener('pointerup',release);st.addEventListener('pointercancel',release);
st.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- lógica ---------- */
function update(dt){T+=dt;
if(!wander.length)wander=Array.from({length:12},(_,i)=>({x:Math.random()*W,y:80+Math.random()*440,ph:i*1.3,v:.3+Math.random()*.5}));
for(const f of wander){f.x+=Math.cos(T*f.v+f.ph)*40*dt;f.y+=Math.sin(T*f.v*1.3+f.ph)*30*dt}
if(mode==='play'){ph+=dt;
 if(phase==='intro'&&ph>.9){phase='build';say(firstGuest?'Here comes '+GN[gi]+'! Grab a lily pad from the pile, take it to the glowing path, and drop it in the water.':'Now it\'s '+GN[gi]+'! The path is longer. Build the bridge!');firstGuest=false}
 if(phase==='build'&&!holding)idleT+=dt;
 if(gs&&!gs.end){gs.s=Math.min(gs.pts.length-1,gs.s+dt/.36);const i=Math.floor(gs.s);if(i!==gs.lastI){gs.lastI=i;tone(gs.ok?Math.min(1200,480+i*28):420,.09,.1)}
  if(gs.s>=gs.pts.length-1){gs.end=T;gs.ok?arrive():fall()}}
 if(gs&&gs.end){const e=T-gs.end;if(gs.ok&&e>2){gi++;if(gi>=3)go('end');else loadGuest()}else if(!gs.ok&&e>2.8)resetGuest()}
 for(const y of B.yac)if(y.snap>0)y.snap=Math.max(0,y.snap-dt/1.1)}
if(mode==='end'&&Math.random()<dt*28)conf.push({x:Math.random()*W,y:-10,vx:(Math.random()-.5)*60,vy:60+Math.random()*80,r:Math.random()*6,vr:(Math.random()-.5)*8,c:COLS[Math.random()*6|0],w:7+Math.random()*6,h:4+Math.random()*4,slow:1});
for(const f of flyers){f.t+=dt/.55;if(f.t>=1&&B){B.pile++;f.d=1;tone(700,.06,.06)}}flyers=flyers.filter(f=>!f.d);
for(const c of conf){c.vy+=(c.slow?20:520)*dt;c.vx*=c.slow?1:.985;c.x+=c.vx*dt;c.y+=c.vy*dt;c.r+=c.vr*dt}conf=conf.filter(c=>c.y<H+20);
ripples=ripples.filter(r=>T-r.t<1.2);if(msg&&(msg.t-=dt)<=0)msg=null;if(hintT>0)hintT-=dt}

/* ---------- dibujo ---------- */
function bubble(m){const a=Math.min(1,m.t*2),mx=Math.max(90,Math.min(W-90,m.x)),my=Math.max(50,m.y);x.globalAlpha=a;x.fillStyle='rgba(255,255,255,.94)';x.beginPath();x.roundRect(mx-80,my-19,160,38,19);x.fill();x.fillStyle='#3b2a00';x.font="700 20px Fredoka,sans-serif";x.textAlign='center';x.textBaseline='middle';x.fillText(m.txt||'TRY AGAIN!',mx,my+1);x.globalAlpha=1}
function drawRipples(){for(const r of ripples){const u=(T-r.t)/1.2;if(u<0)continue;x.strokeStyle=`rgba(200,240,255,${(1-u)*.6})`;x.lineWidth=3;x.beginPath();x.ellipse(r.x,r.y,(r.big?25:18)+u*(r.big?70:45),((r.big?25:18)+u*(r.big?70:45))*.6,0,0,7);x.stroke()}}
function glowCell(q,c,i){const gl=.15+.1*Math.sin(T*3-i*.55);x.fillStyle=`rgba(255,230,110,${gl})`;x.beginPath();x.roundRect(q.x-c/2+5,q.y-c/2+5,c-10,c-10,c*.2);x.fill();
x.strokeStyle='rgba(255,230,110,.45)';x.lineWidth=2.5;x.setLineDash([6,6]);x.stroke();x.setLineDash([])}
function drawPlay(){const c=B.cell,a=phase==='intro'?Math.min(1,ph/.6):1,sp=startPt(),gp=goalPt();
x.save();x.globalAlpha=a;
x.strokeStyle='rgba(255,255,255,.11)';x.lineWidth=2;for(let i=0;i<B.cols;i++)for(let j=0;j<B.rows;j++){x.beginPath();x.roundRect(BX+i*c+3,B.y0+j*c+3,c-6,c-6,c*.18);x.stroke()}
x.strokeStyle=`rgba(255,230,110,${.14+.06*Math.sin(T*3)})`;x.lineWidth=c*.45;x.lineCap='round';x.beginPath();x.moveTo(sp.x+10,sp.y);x.lineTo(BX+4,sp.y);x.moveTo(BX+BW-4,gp.y);x.lineTo(gp.x-12,gp.y);x.stroke();
B.path.forEach((p,i)=>{if(!B.pads.has(k2(p)))glowCell(cc(p[0],p[1]),c,i)});
x.restore();
torch(gp.x-14,gp.y-c*.42);torch(gp.x-14,gp.y+c*.42+10);
for(const y of B.yac){const q=cc(y.c,y.r),open=y.snap>0?(y.snap>.8?1:0):Math.pow(Math.max(0,Math.sin(T*1.7+y.ph)),.6);yacare(q.x,q.y,c*.95,y.dir,open,y.ph)}
for(const [k,p] of B.pads){const [i,j]=k.split(',').map(Number),q=cc(i,j),age=T-p.at,pop=Math.min(1,age*6),bob=Math.sin(T*2+i+j)*.03;
 if(p.ok){const g=x.createRadialGradient(q.x,q.y,5,q.x,q.y,c*.6);g.addColorStop(0,'rgba(255,230,110,.35)');g.addColorStop(1,'rgba(255,230,110,0)');x.fillStyle=g;x.fillRect(q.x-c*.6,q.y-c*.6,c*1.2,c*1.2)}
 lily(q.x,q.y,c*.42*(.6+.4*pop)*(1+bob),p.rot,p.fl);
 if(!p.ok&&age<1){x.strokeStyle=`rgba(255,110,110,${1-age})`;x.lineWidth=4;x.beginPath();x.arc(q.x,q.y,c*.45+age*12,0,7);x.stroke()}}
drawRipples();
party();
const gsc=Math.min(.72,c/135),foot=c*.22;
if(!gs){const pop=phase==='intro'?Math.min(1,ph/.5):1,j=phase==='intro'?Math.sin(Math.min(1,ph/.5)*Math.PI)*20:Math.abs(Math.sin(T*2.5))*4;guest(gi,sp.x,sp.y+foot-j,gsc*pop,1,false)}
else{const i=Math.min(gs.pts.length-2,Math.floor(gs.s)),u=gs.s-i,p0=gs.pts[i],p1=gs.pts[i+1],pp=lerp(p0,p1,gs.end?1:u),lift=gs.end?0:Math.sin(u*Math.PI)*c*.35;
 const onShore=gs.ok&&i>=gs.pts.length-2,sc=onShore?gsc+(.42-gsc)*(gs.end?1:u):gsc;
 if(!gs.ok&&gs.end){const s=Math.min(1,(T-gs.end)/.8);if(s<1){x.save();x.globalAlpha=1-s;guest(gi,pp.x,pp.y+foot+s*18,gsc*(1-s*.5),0,false);x.restore()}}
 else if(!(gs.ok&&gs.end))guest(gi,pp.x,pp.y+foot-lift,sc,1,false)}
const hint=phase==='build'&&!holding&&(idleT>3||hintT>0)&&B.pile>0;
drawPile(B.pile,hint?.9+.3*Math.sin(T*8):(holding?.1:.35+.15*Math.sin(T*3)),true);
if(hint){const b=Math.abs(Math.sin(T*4))*14;x.fillStyle='#ffe680';x.beginPath();x.moveTo(PX-16,PY-92-b);x.lineTo(PX+16,PY-92-b);x.lineTo(PX,PY-66-b);x.closePath();x.fill();mouseIcon(PX,PY-140-b,.7,Math.sin(T*4)>0)}
for(const f of flyers){const p=lerp({x:f.x0,y:f.y0},{x:PX,y:PY-40},f.t);lily(p.x,p.y-Math.sin(f.t*Math.PI)*60,c*.42+(42-c*.42)*f.t,T*4,false)}
if(holding){const h=cellAt(pos);if(h){const q=cc(h[0],h[1]),bad=yacAt(h)||B.pads.has(k2(h));x.strokeStyle=bad?'rgba(255,120,120,.9)':'rgba(255,255,255,.9)';x.lineWidth=4;x.beginPath();x.roundRect(q.x-c/2+3,q.y-c/2+3,c-6,c-6,c*.18);x.stroke()}
 x.fillStyle='rgba(0,0,0,.28)';x.beginPath();x.ellipse(pos.x+8,pos.y+12,c*.4,c*.3,0,0,7);x.fill();lily(pos.x,pos.y,c*.42,.4,false)}
if(msg)bubble(msg);
confetti();
for(let i=0;i<3;i++){const hx=420+60*i,hy=44,done=arrived.includes(i),cur=i===gi&&!done;x.save();if(done){x.shadowColor='#ffd54a';x.shadowBlur=18}
 x.fillStyle='rgba(6,12,30,.72)';x.strokeStyle=done?'#ffe680':cur?'#fff':'rgba(255,255,255,.3)';x.lineWidth=3;x.beginPath();x.arc(hx,hy,27,0,7);x.fill();x.stroke();x.restore();
 x.save();x.globalAlpha=done||cur?1:.45;guest(i,hx,hy+21,.34,0,false);x.restore();
 if(done){x.fillStyle='#3fae5a';x.beginPath();x.arc(hx+19,hy+19,9,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=3;x.lineCap='round';x.beginPath();x.moveTo(hx+15,hy+19);x.lineTo(hx+18,hy+22);x.lineTo(hx+23,hy+15);x.stroke()}}}

function drawDemo(){const tm=T%9.6,C=[0,1,2].map(i=>({x:452+90*i,y:285})),RL={x:360,y:285},RR={x:722,y:285},REST={x:300,y:420},P0={x:PX,y:PY-40};
let p=REST,pr=false,carry=false,placed=0;
if(tm<.8)p=lerp(REST,P0,ease(tm/.8));
else if(tm<6.2){const i=Math.floor((tm-.8)/1.8),u=tm-.8-i*1.8;placed=i;
 if(u<.3){p=P0;pr=u>.12;carry=u>.18}else if(u<1.2){p=lerp(P0,C[i],ease((u-.3)/.9));pr=carry=true}
 else if(u<1.4){p=C[i];if(u<1.28)pr=carry=true;else placed=i+1}else{p=lerp(C[i],P0,ease((u-1.4)/.4));placed=i+1}}
else{placed=3;p=lerp(P0,REST,ease(Math.min(1,(tm-6.2)/.6)))}
rock(RL.x,RL.y,42);rock(RR.x,RR.y,48);
C.forEach((q,i)=>{if(i<placed)lily(q.x,q.y,38,i*2+.5,i===1);else glowCell(q,90,i)});
drawPile(3-placed-(carry?1:0),.4,false);
mimi(RR.x+10,RR.y+18,.42,0,-1,tm>8.4);
let d=RL,lift=0;if(tm>6.6){const R=[RL,...C,RR],s=Math.min(4,(tm-6.6)/.42),i=Math.min(3,Math.floor(s)),u=s-i;d=lerp(R[i],R[i+1],s>=4?1:u);lift=s>=4?0:Math.sin(u*Math.PI)*30}
guest(0,d.x-(tm>8.3?22:0),d.y+18-lift,.55,1,false);
if(carry){x.fillStyle='rgba(0,0,0,.28)';x.beginPath();x.ellipse(p.x+8,p.y+12,34,26,0,0,7);x.fill();lily(p.x,p.y,38,.4,false)}
if(tm>=.8&&tm<6.2){const u=(tm-.8)%1.8;if(u>.1&&u<.45){x.strokeStyle='#ffd54a';x.lineWidth=4;x.beginPath();x.arc(p.x,p.y,8+(u-.1)*90,0,7);x.stroke()}
 if(u>1.25&&u<1.6){x.strokeStyle='#8fe0ff';x.lineWidth=4;x.beginPath();x.arc(p.x,p.y,8+(u-1.25)*90,0,7);x.stroke()}}
cursorArrow(p.x,p.y);mouseIcon(p.x+52,p.y+36,.6,pr)}

function endGuests(){[[0,450],[1,610],[2,710]].forEach(([k,gx],i)=>guest(k,gx,566-Math.abs(Math.sin(T*3+i*1.1))*22,.8,i===0?-1:1,true))}

function draw(){x.setTransform(cv.width/W,0,0,cv.height/H,0,0);
if(mode==='end'){x.drawImage(bg,0,0,W,H);drawEnd();return}
x.drawImage(bgT,0,0,W,H);
if(mode==='start')drawDemo();
else if(mode==='pick'){party();drawPile(8,.35,false)}
else if(mode==='play')drawPlay();
if(mode!=='play')for(const f of wander)ff(f.x,f.y,f.ph,.45)}
let last=0;function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}

/* ---------- botones ---------- */
document.querySelectorAll('.lv').forEach(b=>{const L=LV[+b.dataset.l],g=genBoard(L.c,L.r,1,L.y),ps=new Set(g.path.map(k2)),ys=new Set(g.yac.map(k=>k.c+','+k.r)),mg=b.querySelector('.mg');let h='';
 for(let r=0;r<L.r;r++)for(let c=0;c<L.c;c++){const k=c+','+r;h+='<i class="'+(ps.has(k)?'p':ys.has(k)?'y':'')+'"></i>'}
 mg.style.gridTemplateColumns='repeat('+L.c+',1fr)';mg.innerHTML=h;
 b.onclick=()=>startLevel(+b.dataset.l);b.onpointerenter=()=>say(b.dataset.say)});
$('go').onclick=()=>{go('pick');say('Choose a pond. Easy, medium or hard.')};
$('back').onclick=()=>{try{speechSynthesis.cancel()}catch(e){}go('start')};
$('next').onclick=()=>startLevel(lvl+1);$('again').onclick=()=>startLevel(lvl);$('home').onclick=()=>go('start');
$('snd').onclick=()=>{sound=!sound;$('snd').textContent=sound?'🔊':'🔇';if(!sound)try{speechSynthesis.cancel()}catch(e){}};
try{speechSynthesis.getVoices()}catch(e){}
fit();go('start');requestAnimationFrame(loop);
</script>
