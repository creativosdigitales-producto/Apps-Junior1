<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>MIMI'S BANNER</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Misma estética que "Mimi y las luciérnagas": laguna nocturna, botones amarillos, Fredoka en mayúsculas. Escenario 16:10 que escala. */
:root{--bg:#0b1533;--btn:#ffd54a;--btnt:#3b2a00;--btns:#c98f00;--ink:#fff;--glow:#ffe680;--shade:#1a2a6c;--panel:rgba(6,12,30,.62);color-scheme:dark}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{height:100%;margin:0;background:var(--bg);font-family:'Fredoka','Trebuchet MS',Arial,sans-serif;text-transform:uppercase;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:min(100vw,160vh);height:min(62.5vw,100vh);overflow:hidden;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;text-align:center;color:var(--ink)}
.scr.on{display:flex}
h1{margin:.45em 0 0;line-height:1.05;font-size:2.7em;color:var(--glow);text-shadow:0 .08em 0 var(--shade),0 0 .5em var(--btn);text-wrap:balance}
.btn,.lv,.round{font-family:inherit;font-weight:700;border:0;cursor:pointer;text-transform:uppercase}
.btn{font-size:1.7em;border-radius:2em;padding:.45em 1.5em;margin:.4em;background:var(--btn);color:var(--btnt);box-shadow:0 .15em 0 var(--btns)}
.btn:active,.lv:active,.round:active{transform:translateY(.12em)}
.btn:focus-visible,.lv:focus-visible,.round:focus-visible{outline:.18em solid var(--ink);outline-offset:.15em}
.row{display:flex;gap:1.2em;margin-top:1.4em}
.lv{font-size:1em;color:var(--ink);border-radius:1.2em;width:12em;min-height:11.5em;padding:.8em .4em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3em;box-shadow:0 .25em 0 rgba(0,0,0,.35)}
.lv b{font-size:1.5em}.lv em{font-style:normal;font-size:2.3em;line-height:1.05;letter-spacing:.06em}.lv em.sm{font-size:1.5em}
.round{position:absolute;top:.5em;width:2.2em;height:2.2em;border-radius:50%;font-size:1.5em;background:var(--btn);color:var(--btnt);box-shadow:0 .1em 0 var(--btns)}
#back{left:.4em;display:none}#snd{right:.4em}
#start{justify-content:flex-start}
.sp{flex:1}
.ins{display:flex;gap:4em;align-items:flex-end;margin-bottom:.2em}.ins div{width:13em;display:flex;flex-direction:column;align-items:center}
.ins b{display:block;font-size:1.3em;color:var(--glow);margin-top:.35em;letter-spacing:.04em}
#start .btn{margin-bottom:.9em}
#end{align-items:flex-end;justify-content:flex-end;padding:0 1em 1em 0;gap:.2em}
#end .btn{font-size:1.25em;padding:.45em 1.1em;margin:.25em 0;width:8.4em}
@media (prefers-reduced-motion:reduce){.btn:active,.lv:active{transform:none}}
</style>
<div id="stage">
<canvas id="c"></canvas>
<div class="scr on" id="start">
  <h1>MIMI'S BANNER</h1>
  <div class="sp"></div>
  <div class="ins">
    <div><svg viewBox="-2 -2 50 74" style="width:3.6em" aria-hidden="true"><rect width="46" height="70" rx="22" fill="#fff" stroke="#8a94b8" stroke-width="3"/><path d="M0 22A22 22 0 0 1 23 0V30H0Z" fill="#ffd54a" stroke="#8a94b8" stroke-width="3"/><path d="M23 0V30" stroke="#8a94b8" stroke-width="3"/></svg><b>HOLD DOWN</b></div>
    <div><svg viewBox="0 0 90 64" style="width:5.4em" aria-hidden="true"><path d="M12 52Q34 4 74 14" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-dasharray="1 11"/><path d="M66 5L82 15L66 24Z" fill="#fff"/><circle cx="12" cy="52" r="10" fill="#fff27a"/><circle cx="12" cy="52" r="16" fill="#ffe680" opacity=".35"/></svg><b>AND DRAG</b></div>
  </div>
  <button class="btn" id="go">START!</button>
</div>
<div class="scr" id="pick" style="justify-content:center">
  <h1>WHAT SHALL WE LIGHT UP?</h1>
  <div class="row">
    <button class="lv" data-k="vocales" data-say="Vowels" style="background:#3fae5a"><em>A E I<br>O U</em><b>VOWELS</b></button>
    <button class="lv" data-k="numeros" data-say="Numbers" style="background:#d99400"><em>1 2 3</em><b>NUMBERS</b></button>
    <button class="lv" data-k="cartel" data-say="Mimi's banner" style="background:#e2603f"><em class="sm">HAPPY<br>BIRTHDAY<br>MIMI</em><b>BANNER</b></button>
  </div>
</div>

  <button class="btn" id="again">↻ AGAIN</button>

<script>
const W=960,H=600,JX=110,JT=400,JB=575,R=44;
const $=i=>document.getElementById(i),cv=$('c'),x=cv.getContext('2d'),st=$('stage');
const COLS=['#e2603f','#3fae5a','#d99400','#4a7be0','#c04fc0','#23a6a6'];
function fit(){const d=Math.min(devicePixelRatio||1,2);cv.width=st.clientWidth*d;cv.height=st.clientHeight*d;st.style.fontSize=st.clientWidth/60+'px'}
addEventListener('resize',fit);

/* ---------- fondo (igual al juego 1) ---------- */
const bg=document.createElement('canvas');bg.width=1920;bg.height=1200;
function drawBg(){const b=bg.getContext('2d');b.scale(2,2);
let g=b.createLinearGradient(0,0,0,400);g.addColorStop(0,'#101a4d');g.addColorStop(.6,'#3a2a7a');g.addColorStop(1,'#7a56a8');b.fillStyle=g;b.fillRect(0,0,W,H);
let s=7;const r=()=>(s=(s*9301+49297)%233280)/233280;
b.fillStyle='#fff';for(let i=0;i<60;i++){b.globalAlpha=.4+r()*.6;b.beginPath();b.arc(r()*W,r()*300,1+r()*1.8,0,7);b.fill()}b.globalAlpha=1;
g=b.createRadialGradient(780,110,40,780,110,150);g.addColorStop(0,'rgba(255,246,200,.6)');g.addColorStop(1,'rgba(255,246,200,0)');b.fillStyle=g;b.fillRect(600,0,360,280);
b.fillStyle='#fff6c8';b.beginPath();b.arc(780,110,58,0,7);b.fill();
b.fillStyle='#5a4a2a';b.beginPath();b.arc(762,102,5,0,7);b.arc(798,102,5,0,7);b.fill();
b.strokeStyle='#5a4a2a';b.lineWidth=4;b.lineCap='round';b.beginPath();b.arc(780,112,18,.2,2.9);b.stroke();
b.fillStyle='rgba(255,140,160,.5)';b.beginPath();b.arc(750,120,8,0,7);b.arc(810,120,8,0,7);b.fill();
b.fillStyle='#2a2f75';[[120,420,260,70],[420,430,320,60],[760,425,280,75]].forEach(o=>{b.beginPath();b.ellipse(o[0],o[1],o[2],o[3],0,Math.PI,0);b.fill()});
g=b.createLinearGradient(0,400,0,H);g.addColorStop(0,'#2a8a8a');g.addColorStop(1,'#0f3d55');b.fillStyle=g;b.fillRect(0,400,W,200);
b.strokeStyle='rgba(255,255,255,.14)';b.lineWidth=3;for(let i=0;i<14;i++){const px=r()*W,py=420+r()*160;b.beginPath();b.moveTo(px,py);b.quadraticCurveTo(px+20,py-6,px+44,py);b.stroke()}
[[40,470,120],[85,455,95],[130,470,135],[745,450,100],[790,462,125]].forEach(c=>{b.strokeStyle='#3d7a3a';b.lineWidth=6;b.beginPath();b.moveTo(c[0],c[1]);b.lineTo(c[0]+8,c[1]-c[2]);b.stroke();b.fillStyle='#7a4a2a';b.beginPath();b.ellipse(c[0]+8,c[1]-c[2]-14,9,22,0,0,7);b.fill()});
[[200,500,50],[700,528,44],[320,578,36],[640,580,40],[880,400,30]].forEach(p=>pad(b,p[0],p[1],p[2]));
b.fillStyle='#ff8fb0';b.beginPath();b.arc(210,494,9,0,7);b.fill();b.fillStyle='#ffe680';b.beginPath();b.arc(210,494,4,0,7);b.fill()}
function pad(b,px,py,rx,big){b.fillStyle=big?'#4cc45f':'#3fae5a';b.beginPath();b.ellipse(px,py,rx,rx*.28,0,0,7);b.fill();b.strokeStyle='#2c8a45';b.lineWidth=3;b.stroke()}
drawBg();

/* ---------- sonido y voz ---------- */
let ac,sound=true;
function tone(f,d=.15,v=.15,w=0,t='sine'){if(!sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime+w;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d)}catch(e){}}
function say(t){if(!sound)return;try{const s=speechSynthesis;s.cancel();const u=new SpeechSynthesisUtterance(t);const vs=s.getVoices(),v=vs.find(v=>/^en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang));if(v)u.voice=v;u.lang=v?v.lang:'en-US';u.rate=.9;u.pitch=1.15;s.speak(u)}catch(e){}}
const NM={A:'ay',E:'ee',I:'eye',O:'oh',U:'you',H:'aitch',P:'pee',Y:'why',B:'bee',R:'are',T:'tee',D:'dee',M:'em','0':'zero','1':'one','2':'two','3':'three','4':'four','5':'five','6':'six','7':'seven','8':'eight','9':'nine'};
const nameOf=c=>(/\d/.test(c)?'the number ':'the letter ')+NM[c];

/* ---------- letras y números como trazos (caja 100 x 140) ---------- */
const ln=(...p)=>{const o=[];for(let i=0;i<p.length;i+=2)o.push([p[i],p[i+1]]);return o};
const ar=(cx,cy,rx,ry,a0,a1)=>{const o=[],n=Math.max(8,Math.abs(a1-a0)/6|0);for(let i=0;i<=n;i++){const a=(a0+(a1-a0)*i/n)*Math.PI/180;o.push([cx+rx*Math.cos(a),cy+ry*Math.sin(a)])}return o};
const qd=(x0,y0,qx,qy,x1,y1)=>{const o=[];for(let i=0;i<=20;i++){const t=i/20,u=1-t;o.push([u*u*x0+2*u*t*qx+t*t*x1,u*u*y0+2*u*t*qy+t*t*y1])}return o};
const S=(...p)=>p.flat();
const G={
A:[ln(10,140,50,0,90,140),ln(27,82,73,82)],
E:[ln(85,0,15,0,15,140,85,140),ln(15,70,70,70)],
I:[ln(50,0,50,140)],
O:[ar(50,70,42,68,-90,-450)],
U:[S(ln(12,0,12,95),ar(50,95,38,45,180,0),ln(88,95,88,0))],
F:[ln(85,0,15,0,15,140),ln(15,68,65,68)],
L:[ln(15,0,15,140,85,140)],
Z:[ln(12,0,88,0,12,140,88,140)],
C:[ar(55,70,45,68,-40,-320)],
M:[ln(10,140,10,0,50,85,90,0,90,140)],
P:[S(ln(15,140,15,0,55,0),ar(55,37.5,35,37.5,-90,90),ln(55,75,15,75))],
H:[ln(15,0,15,140),ln(85,0,85,140),ln(15,70,85,70)],
Y:[ln(10,0,50,70,50,140),ln(90,0,50,70)],
B:[ln(15,0,15,140),S(ln(15,0,52,0),ar(52,34,32,34,-90,90),ln(52,68,56,68),ar(56,104,34,36,-90,90),ln(56,140,15,140))],
R:[S(ln(15,140,15,0,55,0),ar(55,37.5,35,37.5,-90,90),ln(55,75,15,75)),ln(42,75,88,140)],
T:[ln(10,0,90,0),ln(50,0,50,140)],
D:[S(ln(15,140,15,0,45,0),ar(45,70,43,70,-90,90),ln(45,140,15,140))],
'0':[ar(50,70,36,68,-90,-450)],
'1':[ln(25,32,55,0,55,140)],
'2':[S(ar(50,40,38,38,-160,20),ln(12,140,88,140))],
'3':[S(ar(48,36,34,36,-150,90),ar(48,106,38,34,-90,150))],
'4':[ln(58,0,8,95,92,95),ln(70,45,70,140)],
'5':[S(ln(82,0,20,0,18,64),ar(48,98,38,42,-128,150))],
'6':[S(qd(74,2,18,30,13,95),ar(50,95,37,43,180,-180))],
'7':[ln(10,0,90,0,38,140)],
'8':[S(ar(50,35,30,35,-90,-270),ar(50,105,38,35,-90,270),ar(50,35,30,35,90,-90))],
'9':[S(ar(50,42,36,42,0,-360),ln(86,42,80,140))]};
function resample(poly,sp=6){const res=[poly[0]];let need=sp;
for(let i=1;i<poly.length;i++){const a=poly[i-1],b=poly[i],d=Math.hypot(b[0]-a[0],b[1]-a[1]);let p=0;
while(d-p>=need){p+=need;const t=p/d;res.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]);need=sp}need-=d-p}
const e=poly[poly.length-1],l=res[res.length-1];if(Math.hypot(e[0]-l[0],e[1]-l[1])>sp*.4)res.push(e);else res[res.length-1]=e;return res}
const tf=(p,cx,top,sc)=>({x:cx+(p[0]-50)*2*sc,y:top+(40+p[1]*2)*sc});

/* ---------- estado ---------- */
const MODES={vocales:'AEIOU',numeros:'0123456789',cartel:'HAPPY BIRTHDAY MIMI'};
let T=0,mode='start',seq=[],items=[],idx=0,Lt=null,phase='',ph=0,holding=false,pos={x:0,y:0},lastP=null,
flyers=[],conf=[],trail=[],msg=null,idleT=0,hintT=0,jmpT=-1,firstLetter=true,lastTick=0,wander=[];
const DEMO=resample(G.L[0]).map(p=>tf(p,600,112,.5));

function go(m){mode=m;holding=false;flyers=[];trail=[];msg=null;
['start','pick','end'].forEach(k=>$(k).classList.toggle('on',k===m));
$('back').style.display=m==='start'?'none':'block';st.style.cursor='default';
if(m==='end'){conf=[];wander=Array.from({length:14},(_,i)=>({x:Math.random()*W,y:160+Math.random()*260,ph:i*1.3,v:.3+Math.random()*.5}));
const n=[[392,.75],[392,.25],[440,1],[392,1],[523,1],[494,2],[392,.75],[392,.25],[440,1],[392,1],[587,1],[523,2]];let t=.2;n.forEach(([f,d])=>{tone(f,d*.32*.95,.12,t,'triangle');t+=d*.32});
setTimeout(()=>say('Happy birthday, Mimi! Thank you for helping her get the party ready!'),t*1000)}}
function startGame(k){seq=[...MODES[k]];items=seq.map((c,i)=>c===' '?-1:i).filter(i=>i>=0);idx=0;firstLetter=true;conf=[];go('play');loadLetter()}
function loadLetter(){const ch=seq[items[idx]];Lt={ch,color:COLS[idx%COLS.length],flies:[],strokes:G[ch].map(s=>({pts:resample(s).map(p=>tf(p,480,100,1)),lit:0,done:false}))};phase='drop';ph=0;holding=false;idleT=0}
const curIdx=()=>Lt.strokes.findIndex(s=>!s.done);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const inJar=p=>Math.abs(p.x-JX)<85&&p.y>JT-40&&p.y<JB+15;

/* ---------- mouse / arrastre ---------- */
function loc(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
st.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;
if(mode==='start'){say('Press the left button on the jar to grab a firefly. Without letting go, take it along the path of the letter.');return}
if(mode!=='play'||phase!=='trace'||e.button!==0)return;const p=loc(e);
if(inJar(p)){holding=true;pos=p;lastP=p;idleT=0;trail=[];try{st.setPointerCapture(e.pointerId)}catch(_){}tone(660,.12,.12);tone(990,.15,.1,.06);st.style.cursor='grabbing'}
else{hintT=1.6;tone(240,.18,.1,0,'triangle')}});
st.addEventListener('pointermove',e=>{const p=loc(e);
if(mode==='play')st.style.cursor=holding?'grabbing':(phase==='trace'&&inJar(p)?'grab':'default');
if(!holding)return;const n=Math.max(1,Math.ceil(dist(lastP,p)/8));for(let i=1;i<=n;i++){advance({x:lastP.x+(p.x-lastP.x)*i/n,y:lastP.y+(p.y-lastP.y)*i/n});if(!holding)break}
pos=p;lastP=p;trail.push({x:p.x,y:p.y,t:T});});
function release(){if(!holding)return;holding=false;st.style.cursor='default';const c=curIdx();if(c<0)return;const s=Lt.strokes[c];
if(s.lit>0){msg={x:pos.x,y:pos.y-60,t:1.2};tone(300,.2,.12,0,'triangle');tone(220,.25,.1,.12,'triangle')}
s.lit=0;flyers.push({x0:pos.x,y0:pos.y,t:0});idleT=0}
st.addEventListener('pointerup',release);st.addEventListener('pointercancel',release);
st.addEventListener('contextmenu',e=>e.preventDefault());
function advance(p){const c=curIdx();if(c<0)return;const s=Lt.strokes[c],n=s.pts.length;
for(let j=s.lit;j<Math.min(s.lit+4,n);j++){if(dist(p,s.pts[j])<R){s.lit=j+1;j=s.lit-1}}
if(s.lit-lastTick>=3||s.lit<lastTick){lastTick=s.lit;if(s.lit>0)tone(420+600*s.lit/n,.06,.05)}
if(s.lit>=n){s.done=true;holding=false;st.style.cursor='default';const e=s.pts[n-1];Lt.flies.push({x:e.x,y:e.y});lastTick=0;
[784,988,1175].forEach((f,i)=>tone(f,.18,.12,i*.07));
if(curIdx()<0)letterDone();else idleT=0}}
function letterDone(){phase='done';ph=0;jmpT=0;burst(480,300,110);[523,659,784,1047].forEach((f,i)=>tone(f,.3,.14,i*.13));say(['Very good!','Great!','You did it!','So bright!'][idx%4])}
function burst(cx,cy,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=200+Math.random()*420;conf.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-260,r:Math.random()*6,vr:(Math.random()-.5)*14,c:COLS[i%6],w:7+Math.random()*6,h:4+Math.random()*4})}}

/* ---------- lógica ---------- */
function update(dt){T+=dt;
if(mode==='play'){ph+=dt;
 if(phase==='drop'&&ph>.7){phase='trace';ph=0;say(firstLetter?'Grab a firefly from the jar and, without letting go, take it along the path of '+nameOf(Lt.ch)+'.':nameOf(Lt.ch)+'. Let\'s light it up!');firstLetter=false}
 if(phase==='trace'&&!holding)idleT+=dt;
 if(phase==='done'&&ph>2.4){idx++;if(idx>=items.length)go('end');else loadLetter()}}
if(mode==='end'){if(Math.random()<dt*28)conf.push({x:Math.random()*W,y:-10,vx:(Math.random()-.5)*60,vy:60+Math.random()*80,r:Math.random()*6,vr:(Math.random()-.5)*8,c:COLS[Math.random()*6|0],w:7+Math.random()*6,h:4+Math.random()*4,slow:1});
 for(const f of wander){f.x+=Math.cos(T*f.v+f.ph)*40*dt;f.y+=Math.sin(T*f.v*1.3+f.ph)*30*dt}}
for(const f of flyers)f.t+=dt/.6;flyers=flyers.filter(f=>f.t<1);
for(const c of conf){c.vy+=(c.slow?20:520)*dt;c.vx*=c.slow?1:.985;c.x+=c.vx*dt;c.y+=c.vy*dt;c.r+=c.vr*dt}conf=conf.filter(c=>c.y<H+20);
trail=trail.filter(t=>T-t.t<.45);if(msg&&(msg.t-=dt)<=0)msg=null;if(hintT>0)hintT-=dt;if(jmpT>=0){jmpT+=dt;if(jmpT>.6)jmpT=-1}}

/* ---------- dibujo ---------- */
function ff(px,py,ph,sc){x.save();x.translate(px,py);x.scale(sc,sc);
let g=x.createRadialGradient(6,0,2,6,0,42);g.addColorStop(0,'rgba(255,240,120,.75)');g.addColorStop(1,'rgba(255,240,120,0)');x.fillStyle=g;x.beginPath();x.arc(6,0,42,0,7);x.fill();
const w=Math.sin(T*25+ph)*.4;x.fillStyle='rgba(255,255,255,.8)';
x.save();x.translate(2,-8);x.rotate(w-.3);x.beginPath();x.ellipse(0,-8,7,13,0,0,7);x.fill();x.restore();
x.save();x.translate(10,-8);x.rotate(.3-w);x.beginPath();x.ellipse(0,-8,7,13,0,0,7);x.fill();x.restore();
x.fillStyle='#fff27a';x.beginPath();x.arc(10,0,12,0,7);x.fill();x.fillStyle='#7b5a3a';x.beginPath();x.arc(-8,0,8,0,7);x.fill();
x.fillStyle='#fff';x.beginPath();x.arc(-11,-2,2.6,0,7);x.arc(-5,-2,2.6,0,7);x.fill();x.fillStyle='#222';x.beginPath();x.arc(-11.5,-2,1.2,0,7);x.arc(-5.5,-2,1.2,0,7);x.fill();
