 if(live.length)live.forEach(f=>{const p=flyPos(f);f.puff=T;puffs.push({x:p.x,y:p.y,t:T})});else puffs.push({x:480,y:150,t:T})}
else if(SN[id]){say(SN[id]);const d={UP:[0,-30],DOWN:[0,30],LEFT:[-38,0],RIGHT:[38,0]}[id];
 const nx=antS.tx+d[0],ny=antS.ty+d[1],cx=Math.max(820,Math.min(935,nx)),cy=Math.max(318,Math.min(392,ny));
 if(cx!==nx||cy!==ny){antS.bump=T;tone(200,.12,.1,0,'triangle')}else{tone(880,.05,.06);tone(990,.05,.06,.08)}
 antS.tx=cx;antS.ty=cy;if(d[0])antS.flip=d[0]>0;antS.arrow={id,t:T}}}

function flyPos(f){const t=T-f.t0;if(t<1.3)return{x:f.x0,y:f.y0+Math.sin(t*4+f.ph)*5};const u=t-1.3;return{x:f.x0+Math.sin(u*3+f.ph)*28+u*f.vx,y:f.y0-u*u*38-u*30}}

/* ---------- teclado físico ---------- */
addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;let id=null;const k=e.key;
if(k&&k.length===1){const u=k.toUpperCase();if(LN[u]||/^\d$/.test(u))id=u;else if(k===' ')id='SPACE'}
else id={Enter:'ENTER',Backspace:'BACK',ArrowUp:'UP',ArrowDown:'DOWN',ArrowLeft:'LEFT',ArrowRight:'RIGHT'}[k]||null;
if(!id&&/^Digit\d$/.test(e.code))id=e.code.slice(5);
if(!id)return;e.preventDefault();if(e.repeat)return;
if(mode==='start'&&(id==='ENTER'||id==='SPACE')){start();return}press(id)});
st.addEventListener('pointerdown',e=>{if(e.target.closest('button')||mode!=='play')return;const r=cv.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W,py=(e.clientY-r.top)/r.height*H;
const k=KEYS.find(k=>px>=k.x&&px<=k.x+k.w&&py>=k.y&&py<=k.y+k.h);if(k)press(k.id)});

/* ---------- lógica ---------- */
function update(dt){T+=dt;
flies=flies.filter(f=>f.puff?T-f.puff<.05:flyPos(f).y>-90);
fish=fish.filter(f=>{const u=(T-f.t0)/1.1;if(u>=0&&!f.sp){f.sp=1;ripples.push({x:f.x0,y:f.base,t:T});splashS(.12)}if(u>=1&&f.sp===1){f.sp=2;ripples.push({x:f.x0+f.dx,y:f.base,t:T});splashS(.18)}return u<1.05});
ripples=ripples.filter(r=>T-r.t<1);puffs=puffs.filter(p=>T-p.t<.5);
if(jmpT>=0){jmpT+=dt;if(jmpT>.7){jmpT=-1;ripples.push({x:480,y:392,t:T,big:1});splashS(.2)}}
if(qT>=0){qT+=dt;if(qT>1.2)qT=-1}
const dx=antS.tx-antS.x,dy=antS.ty-antS.y,dd=Math.hypot(dx,dy);if(dd>1){const m=Math.min(dd,140*dt);antS.x+=dx/dd*m;antS.y+=dy/dd*m}
if(!wander.length)wander=Array.from({length:9},(_,i)=>({x:Math.random()*W,y:50+Math.random()*170,ph:i*1.3,v:.3+Math.random()*.5}));
for(const f of wander){f.x+=Math.cos(T*f.v+f.ph)*40*dt;f.y+=Math.sin(T*f.v*1.3+f.ph)*30*dt}}

/* ---------- dibujo ---------- */
function drawRipples(){for(const r of ripples){const u=(T-r.t)/1;if(u<0)continue;const R=(r.big?30:14)+u*(r.big?70:40);x.strokeStyle=`rgba(200,240,255,${(1-u)*.7})`;x.lineWidth=3;x.beginPath();x.ellipse(r.x,r.y,R,R*.3,0,0,7);x.stroke()}}
function drawScene(){
for(const f of wander)ff(f.x,f.y,f.ph,.4);
pad(x,480,395,120,true);
const jo=jmpT>=0?Math.sin(Math.min(1,jmpT/.7)*Math.PI)*120:0;mimi(480,392,.72,jo,0,jo>2);
if(jmpT>=0&&jmpT<.7)for(let i=0;i<5;i++){const a=i/5*6.28+T*3;x.fillStyle='#fff6c8';x.beginPath();x.arc(480+Math.cos(a)*70,392-jo-60+Math.sin(a)*50,3,0,7);x.fill()}
const qa=qT>=0?Math.abs(Math.sin(qT*12))*(qT<.45?1:0):0;duck(95,368-(qT>=0&&qT<.45?Math.abs(Math.sin(qT*14))*10:0),.95,qa>.3,1);
if(qT>=0)bubble('QUACK!',160,255,Math.min(1,(1.2-qT)*3));
const as=1+(antS.y-318)/74*.35,moving=Math.hypot(antS.tx-antS.x,antS.ty-antS.y)>1,bump=T-antS.bump<.3?Math.sin((T-antS.bump)*40)*4:0;
x.fillStyle='rgba(0,0,0,.2)';x.beginPath();x.ellipse(antS.x,antS.y+12*as,22*as,5*as,0,0,7);x.fill();
ant(antS.x+bump,antS.y,moving?T*3:0,1.25*as,antS.flip);
if(antS.arrow&&T-antS.arrow.t<.9){const a=1-(T-antS.arrow.t)/.9,ang={UP:-Math.PI/2,DOWN:Math.PI/2,LEFT:Math.PI,RIGHT:0}[antS.arrow.id];x.save();x.globalAlpha=a;x.translate(antS.x,antS.y-48);x.rotate(ang);x.fillStyle='#4a7be0';x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();x.moveTo(18,0);x.lineTo(0,-15);x.lineTo(0,-7);x.lineTo(-16,-7);x.lineTo(-16,7);x.lineTo(0,7);x.lineTo(0,15);x.closePath();x.fill();x.stroke();x.restore()}
for(const f of fish){const u=(T-f.t0)/1.1;if(u<0||u>1)continue;const px=f.x0+f.dx*u,py=f.base-Math.sin(u*Math.PI)*f.h,rot=Math.atan2(-Math.cos(u*Math.PI)*Math.PI*f.h,f.dx);x.save();x.beginPath();x.rect(0,0,W,f.base+4);x.clip();fishD(px,py,f.dx>0?rot:rot+Math.PI,f.c,1);x.restore()}
drawRipples();
if(numBub&&T-numBub.t0<1.8){const u=T-numBub.t0,a=Math.min(1,(1.8-u)*3),s=Math.min(1,u*6);x.save();x.globalAlpha=a;x.translate(480,130);x.scale(s,s);x.fillStyle='rgba(143,224,255,.25)';x.strokeStyle='rgba(200,240,255,.9)';x.lineWidth=4;x.beginPath();x.arc(0,0,48,0,7);x.fill();x.stroke();
 x.fillStyle='#fff';x.font='700 60px Fredoka,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(numBub.n,0,4);x.fillStyle='rgba(255,255,255,.6)';x.beginPath();x.ellipse(-22,-24,9,5,-.6,0,7);x.fill();x.restore()}
for(const f of flies){if(f.puff)continue;const t=T-f.t0,p=flyPos(f),pop=t<.35?1+Math.sin(t/.35*Math.PI)*.25:1,sc=Math.min(1,t/.2)*pop,a=p.y<30?Math.max(0,(p.y+90)/120):1;bigFly(p.x,p.y,f.ch,sc*.95,a,f.ph)}
for(const p of puffs)puffD(p.x,p.y,(T-p.t)/.5)}

function drawCover(){x.fillStyle='rgba(6,12,30,.72)';x.fillRect(0,0,W,H);
const items=['LETTERS','NUMBERS','SPACE','ENTER','ARROWS','BACKSPACE'];
items.forEach((lab,i)=>{const cx=110+i*148,top=138,w=132,h=250;x.fillStyle='#142357';x.strokeStyle='rgba(255,230,110,.45)';x.lineWidth=2.5;x.beginPath();x.roundRect(cx-w/2,top,w,h,18);x.fill();x.stroke();
 const ky=top+40,cy=top+140,t=(T+i*.7)%3,on=t<.35?1-t/.35:0;
 x.fillStyle='#ffe680';x.font='700 17px Fredoka,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(lab,cx,top+h-20);
 x.save();x.beginPath();x.roundRect(cx-w/2,top,w,h,18);x.clip();
 if(i===0){keyCap('let',cx,ky,50,38,on,'A');bigFly(cx,cy-Math.min(1,t/1.5)*20+Math.sin(T*3)*4,'A',.62,1,1)}
 else if(i===1){keyCap('num',cx,ky,50,38,on,'3');x.fillStyle='rgba(143,224,255,.25)';x.fillRect(cx-w/2,cy+36,w,40);for(let j=0;j<3;j++){const u=((t-j*.15)/1.1);if(u>0&&u<1){const px=cx-40+j*40,py=cy+44-Math.sin(u*Math.PI)*75;fishD(px,py,-Math.cos(u*Math.PI)*1.1,FC[j],.7)}}}
 else if(i===2){keyCap('space',cx,ky,110,38,on,'SPACE');pad(x,cx,cy+60,50,true);mimi(cx,cy+58,.38,t<.9?Math.sin(t/.9*Math.PI)*55:0,0,t<.9)}
 else if(i===3){keyCap('enter',cx,ky,80,38,on,'ENTER');duck(cx-10,cy+62,.72,t<.5&&Math.sin(t*24)>0,1);if(t<1.1)bubble('QUACK!',cx,cy-34,1)}
 else if(i===4){[['▲',0,-1],['◀',-1,0],['▼',0,0],['▶',1,0]].forEach(([l,dx,dy],j)=>keyCap('arrow',cx+dx*34,ky+6+dy*26,30,24,Math.floor(t/.75)===j?.8:0,l));const ph=(T%4)/4,px=cx+Math.sin(ph*6.28)*20;ant(px,cy+50,T*3,1.1,Math.cos(ph*6.28)>0)}
 else{keyCap('back',cx,ky,112,38,on,'BACKSPACE');if(t<1.4)bigFly(cx,cy+10,'M',.55,1,2);else puffD(cx,cy+10,Math.min(1,(t-1.4)/.5),.9)}
 x.restore()})}

function draw(){x.setTransform(cv.width/W,0,0,cv.height/H,0,0);x.drawImage(bg2,0,0,W,H);
drawScene();if(mode==='start')drawCover();else drawKeyboard()}
let last=0;function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}

/* ---------- navegación ---------- */
function start(){mode='play';$('start').classList.remove('on');$('back').style.display='block';try{st.focus()}catch(e){}flies=[];fish=[];say('Press any key and see what happens in the pond!')}
$('go').onclick=start;
$('back').onclick=()=>{mode='start';$('start').classList.add('on');$('back').style.display='none';try{speechSynthesis.cancel()}catch(e){}};
$('snd').onclick=()=>{sound=!sound;$('snd').textContent=sound?'🔊':'🔇';if(!sound)try{speechSynthesis.cancel()}catch(e){}};
try{speechSynthesis.getVoices()}catch(e){}
fit();requestAnimationFrame(loop);
</script>
