function star(px,py,r,fill,glow){x.save();if(glow){x.shadowColor='#ffe680';x.shadowBlur=glow}x.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;x.lineTo(px+Math.cos(a)*rr,py+Math.sin(a)*rr)}x.closePath();
if(fill){x.fillStyle=fill;x.fill()}else{x.strokeStyle='rgba(255,230,110,.55)';x.lineWidth=3;x.stroke()}x.restore()}
function drawMaze(){const c=M.cell,a=phase==='intro'?Math.min(1,ph/.6):1;x.globalAlpha=a;x.drawImage(M.cv,0,0,W,H);x.globalAlpha=1;
if(!won){const g={x:M.cx(M.goal[0]),y:M.cy(M.goal[1])},p=1+Math.sin(T*4)*.08,gr=x.createRadialGradient(g.x,g.y,4,g.x,g.y,c*.8);gr.addColorStop(0,'rgba(255,230,110,.6)');gr.addColorStop(1,'rgba(255,230,110,0)');x.fillStyle=gr;x.fillRect(g.x-c,g.y-c,c*2,c*2);star(g.x,g.y-c*.05,c*.34*p,'#ffe14a',20)}
let px=M.cx(me.c),py=M.cy(me.r),lift=0,sx=0;
if(anim){const u=Math.min(1,anim.u);if(anim.bump){const b=Math.sin(u*Math.PI)*c*.18;px+=anim.bump[0]*b;py+=anim.bump[1]*b}else{px=M.cx(anim.f[0])+(M.cx(anim.t[0])-M.cx(anim.f[0]))*u;py=M.cy(anim.f[1])+(M.cy(anim.t[1])-M.cy(anim.f[1]))*u;lift=Math.sin(u*Math.PI)*c*anim.h}}
if(won)lift=Math.abs(Math.sin(ph*6))*c*.3*(ph<1.5?1:0);
const sc=c/150;x.fillStyle='rgba(0,0,0,.28)';x.beginPath();x.ellipse(px,py+c*.28,c*.32*(1-lift/(c*2)),c*.08,0,0,7);x.fill();
mimi(px,py+c*.28,sc,lift/sc,face==='LEFT'?-1:face==='RIGHT'?1:0,won);
if(hintKey&&T<hintUntil&&mode==='play'&&!anim){const a=.55+.35*Math.sin(T*8);x.save();x.globalAlpha=a;
 if(hintKey==='SPACE'){x.strokeStyle='#8fe0a0';x.lineWidth=6;x.lineCap='round';const v=DV[face]||[1,0];x.beginPath();x.moveTo(px,py-c*.9);x.quadraticCurveTo(px+v[0]*c,py-c*1.8+v[1]*c,px+v[0]*c*2,py-c*.9+v[1]*c*2);x.stroke()}
 else{const v=DV[hintKey];x.translate(px+v[0]*c*.95,py+v[1]*c*.95-c*.2);x.rotate(Math.atan2(v[1],v[0]));x.fillStyle='#4a7be0';x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();x.moveTo(c*.28,0);x.lineTo(0,-c*.24);x.lineTo(0,-c*.1);x.lineTo(-c*.24,-c*.1);x.lineTo(-c*.24,c*.1);x.lineTo(0,c*.1);x.lineTo(0,c*.24);x.closePath();x.fill();x.stroke()}x.restore()}}
function drawHud(){for(let i=0;i<6;i++){const hx=480+(i-2.5)*52,hy=36,done=i<lv||(i===lv&&won&&starFly&&starFly.t>=1);x.fillStyle='rgba(6,12,30,.7)';x.beginPath();x.arc(hx,hy,21,0,7);x.fill();
 if(i===lv&&!done){x.strokeStyle='#fff';x.lineWidth=3;x.stroke()}done?star(hx,hy,15,'#ffe14a',14):star(hx,hy,14,null)}
if(starFly&&starFly.t<1){const u=ease(Math.min(1,starFly.t)),hx=480+(lv-2.5)*52,p={x:starFly.x0+(hx-starFly.x0)*u,y:starFly.y0+(36-starFly.y0)*u-Math.sin(u*Math.PI)*80};star(p.x,p.y,18+10*(1-u),'#ffe14a',24)}}
function drawEnd(){x.drawImage(bg,0,0,W,H);pad(x,400,556,170,true);
for(let i=0;i<6;i++){const a=Math.PI*(1.15+i*.14),sx=480+Math.cos(a)*330,sy=330+Math.sin(a)*230;star(sx,sy+Math.sin(T*3+i)*5,26,'#ffe14a',26)}
x.save();x.translate(620,420);x.rotate(-.08);x.fillStyle='#f3e2b3';x.beginPath();x.roundRect(-110,-70,220,140,10);x.fill();x.fillStyle='#e0c98f';x.beginPath();x.roundRect(-122,-78,24,156,12);x.roundRect(98,-78,24,156,12);x.fill();
x.strokeStyle='#c0504a';x.lineWidth=4;x.setLineDash([2,10]);x.lineCap='round';x.beginPath();x.moveTo(-80,40);x.bezierCurveTo(-40,-50,10,50,60,-30);x.stroke();x.setLineDash([]);
x.lineWidth=6;x.beginPath();x.moveTo(52,-40);x.lineTo(72,-20);x.moveTo(72,-40);x.lineTo(52,-20);x.stroke();
x.fillStyle='#fff6c8';x.beginPath();x.arc(-70,-40,14,0,7);x.fill();x.fillStyle='#e0c98f';x.beginPath();x.arc(-64,-44,12,0,7);x.fill();x.restore();
mimi(400,552,1.05,Math.abs(Math.sin(T*3))*28,1,true);for(const f of wander)ff(f.x,f.y,f.ph,.5);confetti()}
function draw(){x.setTransform(cv.width/W,0,0,cv.height/H,0,0);
if(mode==='end'){drawEnd();return}

for(const f of wander)ff(f.x,f.y,f.ph,.4);
if(mode==='play'){drawHud();confetti()}
drawKeys()}
let last=0;function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}

/* ---------- navegación ---------- */
function go(m){mode=m;['start','pick','end'].forEach(k=>$(k).classList.toggle('on',k===m));$('back').style.display=m==='start'?'none':'block';
try{st.focus()}catch(e){}

 setTimeout(()=>{if(mode==='end')say('Mimi got out of the maze! Now she has the map to find the moon treasure.')},t*1000)}}
